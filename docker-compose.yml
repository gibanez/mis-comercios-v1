services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mis-comercios-app
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mis-comercios

  nginx:
    image: nginx:alpine
    container_name: mis-comercios-nginx
    ports:
      - "9980:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mis-comercios

  db:
    image: mysql:8.0
    container_name: mis-comercios-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mis_comercios
      MYSQL_USER: mis_comercios
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mis-comercios

networks:
  mis-comercios:
    driver: bridge

volumes:
  db_data:
